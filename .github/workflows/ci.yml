# CI Workflow — WP-006 Environments + CI/CD
#
# Per AISE S0 v0.3 §27 (PRODUCT DELIVERY FIRST & COMPLEXITY BUDGET):
# GitHub CI is lightweight and STATELESS — lint + typecheck only.
# These require ZERO secrets, ZERO variables, ZERO database access.
#
# Build is excluded from GitHub CI because Next.js page-data collection
# requires DATABASE_URL at build time. Build remains a LOCAL AISE quality gate.
#
# No GitHub Actions Secrets required.
# No GitHub Actions Variables required.
# No manual GitHub configuration required.

name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
